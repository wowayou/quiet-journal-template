{{- with partial "newsletter/for-page.html" . -}}
<section class="newsletter" aria-labelledby="newsletter-title">
  <h2 id="newsletter-title">{{ .heading }}</h2>
  <p>{{ .text }}</p>
  <form action="{{ .action }}" method="post" class="newsletter__form">
    <label for="newsletter-email">你的邮箱</label>
    <div class="newsletter__fields">
      <input id="newsletter-email" type="email" name="email" autocomplete="email" placeholder="you@example.com" required maxlength="254">
      <input type="hidden" name="embed" value="1">
      <button type="submit">邮件订阅</button>
    </div>
  </form>
  <p class="newsletter__notice">提交后前往 Buttondown 完成验证。<a href="{{ .url }}" rel="external noopener noreferrer">独立订阅页面</a> · <a href="https://buttondown.com/legal/privacy" rel="external noopener noreferrer">隐私说明</a>{{ with site.Home.OutputFormats.Get "rss" }} · <a href="{{ .RelPermalink }}">RSS</a>{{ end }}</p>
</section>
{{- end -}}
