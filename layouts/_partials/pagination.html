{{- if gt .TotalPages 1 }}
<nav class="pagination" aria-label="分页">
  {{- with .Prev }}<a href="{{ .URL }}" rel="prev">← 较新</a>{{ else }}<span></span>{{ end }}
  <span class="pagination__status">{{ .PageNumber }} / {{ .TotalPages }}</span>
  {{- with .Next }}<a href="{{ .URL }}" rel="next">较早 →</a>{{ else }}<span></span>{{ end }}
</nav>
{{- end }}
