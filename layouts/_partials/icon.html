{{- /*
  内联 SVG 图标。参数：name（assets/icons/<name>.svg）、size（像素，默认 20）、class。
  品牌图标来自 simple-icons（CC0）；线条图标为本模板绘制。找不到时用 link 图标。
*/ -}}
{{- $r := resources.Get (printf "icons/%s.svg" .name) | default (resources.Get "icons/link.svg") -}}
{{- $size := .size | default 20 -}}
{{- $attrs := printf `<svg class="icon %s" width="%d" height="%d" aria-hidden="true" focusable="false" ` (.class | default "") $size $size -}}
{{- replace (strings.TrimSpace $r.Content) "<svg " $attrs | safeHTML -}}
