<!doctype html>
{{- $site := hugo.Data.site }}
<html lang="{{ site.Language.Locale | default "zh-CN" }}" data-theme="{{ $site.theme | default "auto" }}" data-accent="{{ $site.accent | default "orange" }}">
  <head>
    {{- partial "head.html" . }}
  </head>
  <body>
    <a class="skip-link" href="#main">跳到正文</a>
    {{- partial "header.html" . }}
    <main id="main" class="site-main wrap" tabindex="-1">
      {{- block "main" . }}{{ end }}
    </main>
    {{- partial "footer.html" . }}
  </body>
</html>
