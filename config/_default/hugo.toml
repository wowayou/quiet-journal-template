# 实例身份与发布开关；核心升级不覆盖本文件。
# 日常网站设置在 data/site.yaml；核心渲染规则在同目录的各配置分片。
baseURL = "https://example.com/"
locale = "zh-CN"
defaultContentLanguage = "zh"
title = "Quiet Journal"
timeZone = "Asia/Shanghai"
hasCJKLanguage = true
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]
buildDrafts = false
buildFuture = false
buildExpired = false
