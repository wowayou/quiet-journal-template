# 古籍与诗词原文
- 欲速则不达。——《论语》
- 过而不改，是谓过矣。——《论语》
- 知之为知之，不知为不知，是知也。——《论语》
- 三人行，必有我师焉。——《论语》
- 学而不思则罔，思而不学则殆。——《论语》
- 工欲善其事，必先利其器。——《论语》
- 人无远虑，必有近忧。——《论语》
- 见贤思齐焉，见不贤而内自省也。——《论语》
- 岁寒，然后知松柏之后凋也。——《论语》
- 成事不说，遂事不谏，既往不咎。——《论语》
- 上善若水。——《道德经》
- 千里之行，始于足下。——《道德经》
- 合抱之木，生于毫末。——《道德经》
- 知足者富。——《道德经》
- 知人者智，自知者明。——《道德经》
- 大器晚成。——《道德经》
- 祸兮福之所倚，福兮祸之所伏。——《道德经》
- 天下难事，必作于易。——《道德经》
- 为之于未有，治之于未乱。——《道德经》
- 慎终如始，则无败事。——《道德经》
- 知止可以不殆。——《道德经》
- 吾生也有涯，而知也无涯。——《庄子》
- 君子之交淡若水。——《庄子》
- 鹪鹩巢于深林，不过一枝。——《庄子》
- 知止而后有定。——《大学》
- 苟日新，日日新，又日新。——《大学》
- 凡事豫则立，不豫则废。——《中庸》
- 尽信书，则不如无书。——《孟子》
- 生于忧患，而死于安乐。——《孟子》
- 不积跬步，无以至千里。——《荀子》
- 锲而不舍，金石可镂。——《荀子》
- 行百里者半于九十。——《战国策》
- 欲穷千里目，更上一层楼。——王之涣
- 山重水复疑无路，柳暗花明又一村。——陆游
- 纸上得来终觉浅，绝知此事要躬行。——陆游
- 长风破浪会有时，直挂云帆济沧海。——李白
- 天生我材必有用。——李白
- 竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。——苏轼
- 人生如逆旅，我亦是行人。——苏轼
- 不识庐山真面目，只缘身在此山中。——苏轼
- 回首向来萧瑟处，也无风雨也无晴。——苏轼
- 问渠那得清如许？为有源头活水来。——朱熹
- 行到水穷处，坐看云起时。——王维
- 沉舟侧畔千帆过，病树前头万木春。——刘禹锡
- 海内存知己，天涯若比邻。——王勃
- 莫愁前路无知己，天下谁人不识君。——高适
- 千淘万漉虽辛苦，吹尽狂沙始到金。——刘禹锡
- 会当凌绝顶，一览众山小。——杜甫
- 宠辱不惊，闲看庭前花开花落。——《小窗幽记》
- 春有百花秋有月，夏有凉风冬有雪。——慧开禅师
